name: homelab-cache

# One container that transparently caches several registries on port 443.
#
# Clients keep using the real names. DNS (or /etc/hosts) on the client points them here:
#
#   docker pull ghcr.io/owner/app   ─▶ ghcr.io     ─┐
#   docker pull quay.io/org/app     ─▶ quay.io      ├─▶ this container :443 ─▶ per-registry cache ─▶ upstream
#   docker pull alpine              ─▶ registry-1.docker.io ─┘     (chosen by TLS server name)
#
#   any other name / IP ─▶ web UI (also plain http://<host>:8080)
#
# The same container also caches apt mirrors (deb.debian.org, archive.ubuntu.com, ...) on port 80 (and 443),
# the same way: point the mirror names here, keep your sources.list as it is.

services:
  homelab-cache:
    container_name: homelab-cache
    # Pulled from Docker Hub. To run a build of this source tree instead, build it under the same name
    # first (docker build -t ameer1234567890/homelab-cache:latest .); Compose uses a local image
    # when one exists, and `docker compose pull` fetches the published one again.
    image: ${REGISTRY_IMAGE:-ameer1234567890/homelab-cache:latest}
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-0.0.0.0}:443:443"                  # every registry, TLS (and apt over https)
      - "${BIND_ADDR:-0.0.0.0}:${APT_HTTP_PORT:-80}:80"  # apt mirrors, plain HTTP. Remove this line if you do not cache apt.
      - "${BIND_ADDR:-0.0.0.0}:${UI_PORT:-8080}:8080"    # web UI, plain HTTP

    # IMPORTANT: the cache must resolve ghcr.io, quay.io, ... to their REAL addresses.
    # If these resolvers also carry your override records, requests would loop back to the cache.
    dns:
      - ${UPSTREAM_DNS:-1.1.1.1}
      - ${UPSTREAM_DNS_2:-8.8.8.8}

    environment:
      # Which registries to cache: id | display name | upstream URL, one per line.
      # The HOSTNAME in the URL is what clients type and what your certificate must cover (no port, no
      # path). The id is a label and the folder name under ./data. Add, remove or comment out lines freely,
      # then run: docker compose up -d
      CACHE_REGISTRIES: |
        hub|Docker Hub|https://registry-1.docker.io
        ghcr|GitHub Container Registry|https://ghcr.io
        quay|Quay|https://quay.io
        gcr|Google Container Registry|https://gcr.io
        k8s|Kubernetes registry|https://registry.k8s.io
        mcr|Microsoft Container Registry|https://mcr.microsoft.com
      # Which apt mirrors to cache: id | display name | upstream hostname, one per line. Clients keep their own
      # sources.list; DNS sends the mirror names here. Comment every line out to turn apt caching off.
      # Only the hostname goes in the URL (no path, no port); the upstream is reached over the scheme you give.
      APT_REPOSITORIES: |
        debian|Debian|https://deb.debian.org
        debian-security|Debian security|https://security.debian.org
        ubuntu|Ubuntu|https://archive.ubuntu.com
        ubuntu-security|Ubuntu security|https://security.ubuntu.com
        ubuntu-ports|Ubuntu ports (arm and others)|https://ports.ubuntu.com
        docker|Docker|https://download.docker.com
        tailscale|Tailscale|https://pkgs.tailscale.com
        raspberrypi|Raspberry Pi OS|https://archive.raspberrypi.com
        armbian|Armbian (GitHub)|https://github.armbian.com
        armbian-netcup|Armbian (netcup)|https://netcup-02.armbian.com
      APT_HTTP_PORT: ${APT_HTTP_PORT:-80}        # only so the web UI can show the right URLs; the host port is set in `ports` above
      APT_INDEX_TTL: ${APT_INDEX_TTL:-5m}        # how long Packages/InRelease files are served without asking the mirror
      APT_PACKAGE_TTL: ${APT_PACKAGE_TTL:-30d}   # how long .deb files are served without asking the mirror
      APT_MAX_SIZE: ${APT_MAX_SIZE:-}            # e.g. 20GB; separate from CACHE_MAX_SIZE. Empty = no limit
      CACHE_TTL: ${CACHE_TTL:-720h}
      # Upper limit for the whole cache, e.g. 50GB. Over it, the least recently pulled images are removed first.
      # Empty means no limit.
      CACHE_MAX_SIZE: ${CACHE_MAX_SIZE:-}
      # error hides the harmless start-up warnings the registry prints in cache mode (2.x printed two). Use warn to see them.
      LOG_LEVEL: ${LOG_LEVEL:-error}
      # Only used when no server certificate is provided (see README).
      TLS_SANS: ${TLS_SANS:-}
      TLS_REGENERATE: ${TLS_REGENERATE:-false}
      TLS_CA_DAYS: ${TLS_CA_DAYS:-3650}
      TLS_CERT_DAYS: ${TLS_CERT_DAYS:-825}
      SCAN_TTL: ${UI_SCAN_TTL:-30}
      # Deleting from the web UI. Set the token to require it, or turn deletion off completely.
      UI_ALLOW_DELETE: ${UI_ALLOW_DELETE:-true}
      UI_ADMIN_TOKEN: ${UI_ADMIN_TOKEN:-}
      # Docker Hub login. Anonymous pulls are rate limited per IP address, and the whole cache shares
      # one address, so authenticate it. Use an access token as the password
      # (hub.docker.com > Account settings > Personal access tokens, read-only is enough).
      HUB_USERNAME: ${HUB_USERNAME:-}
      HUB_PASSWORD: ${HUB_PASSWORD:-}
      # Outbound proxy for the cache's own upstream traffic (optional).
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    # Logins for the other registries (GHCR_USERNAME, GHCR_PASSWORD, ...). Docker Hub is set above.
    env_file:
      - path: ./credentials.env
        required: false

    volumes:
      - ${CACHE_DATA_DIR:-./data}:/data
      # Your certificate: server.crt (full chain) + server.key, optionally ca.crt.
      # Add :ro when you provide them yourself. Leave rw to auto-generate (see README).
      - ${CERTS_DIR:-./certs}:/certs
      # Extra root CAs to trust when talking to upstream registries (TLS-inspecting proxies, ...).
      - ${UPSTREAM_CA_DIR:-./certs/upstream}:/upstream-ca:ro
      # Friendly names for client IP addresses in the pull history (optional).
      - ./clients.conf:/etc/registry-cache/clients.conf:ro
