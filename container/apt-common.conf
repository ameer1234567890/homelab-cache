# Included inside each apt mirror location. Unlike registry traffic, apt files are cached by nginx itself.
proxy_http_version 1.1;
proxy_set_header Connection       "";
proxy_set_header Host             $server_name;
# Packages are already compressed; never let a mirror re-encode them or vary the cached copy.
proxy_set_header Accept-Encoding  "";
proxy_ssl_server_name on;
proxy_ssl_name        $server_name;
proxy_connect_timeout 10s;
proxy_read_timeout    900s;

# Methods apt uses. With caching on, nginx does not forward the client's Range or conditional headers:
# it fetches the whole file once and answers ranges and If-Modified-Since from its own copy.
limit_except GET HEAD { deny all; }

# Big downloads must be buffered and written to the cache whatever the client does. A client that disconnects
# part-way (an interrupted or retried download) must not discard a half-fetched package.
proxy_buffering          on;
proxy_ignore_client_abort on;

proxy_cache            apt;
proxy_cache_key        $server_name$request_uri;
proxy_cache_lock       on;          # ten clients asking for the same new .deb cause one download
proxy_cache_lock_timeout 5m;
proxy_cache_lock_age     5m;
proxy_cache_revalidate on;          # expired index files are re-checked with a conditional request (cheap 304)
proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;   # mirror down: serve what we have
proxy_ignore_headers   Cache-Control Expires Set-Cookie Vary;

# curl -I http://deb.debian.org/debian/dists/stable/InRelease | grep -i x-cache-status
add_header X-Cache-Status $upstream_cache_status always;
# What the mirror itself answered when the cache had to ask it (empty on a cache hit). A 301/302/307 here means the
# mirror redirects clients elsewhere, which the cache passes on and therefore cannot store.
add_header X-Upstream-Status $upstream_status always;
